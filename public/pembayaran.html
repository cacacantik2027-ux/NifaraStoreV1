<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran — Nifara Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/index.html" class="brand"><span data-brand-main>NIFARA</span> <em data-brand-accent>STORE</em></a>
      <div class="nav-links">
        <a href="/produk.html" data-nav="produk">Produk</a>
        <a href="/cara-order.html" data-nav="alur">Cara Order</a>
        <a href="/pembayaran.html" data-nav="bayar">Pembayaran</a>
      </div>
      <a href="#" target="_blank" rel="noopener" class="btn btn-brass" data-nav-cta>Buka di Telegram</a>
      <button type="button" class="nav-toggle" data-nav-toggle aria-label="Buka menu">☰</button>
    </div>
  </nav>

  <div class="page-header">
    <div class="wrap">
      <a href="/index.html" class="back-link">← Kembali ke Beranda</a>
    </div>
  </div>

  <section id="bayar">
    <div class="wrap">
      <div class="section-head">
        <h2 data-t="bayarTitle">Metode pembayaran</h2>
        <p data-t="bayarDesc">Pilihan yang sudah disiapkan di bot.</p>
      </div>

      <div class="pay-grid" id="payGrid"></div>

      <div class="qris-grid" id="qrisGrid"></div>
    </div>
  </section>

  <footer>
    <div class="wrap" data-footer-text>© Nifara Store 2026</div>
  </footer>

  <script src="/site.js"></script>
  <script>
    (async function () {
      try {
        const data = await loadSiteData();
        renderChrome(data, 'bayar', 'Pembayaran');
        const t = data.texts || {};
        document.querySelectorAll('[data-t]').forEach((el) => {
          const key = el.getAttribute('data-t');
          if (t[key] != null) el.textContent = t[key];
        });

        const methods = data.paymentMethods || [];
        // Metode dengan foto (mis. QRIS) ditampilkan sebagai kartu QR besar,
        // sisanya sebagai chip ringkas seperti sebelumnya.
        const withPhoto = methods.filter((m) => m.photo);
        const chips     = methods.filter((m) => !m.photo);

        const payGrid = document.getElementById('payGrid');
        let chipsHtml = chips.map((m) => `
          <div class="pay-chip">
            <span class="ic">${escapeHtml(m.icon || '💳')}</span>
            <div><b>${escapeHtml(m.name)}</b><span>${/qris/i.test(m.name) ? 'Scan & bayar' : (/dana|gopay|ovo/i.test(m.name) ? 'E-wallet' : 'Transfer bank')}</span></div>
          </div>`).join('');
        chipsHtml += `
          <div class="pay-chip">
            <span class="ic">✨</span>
            <div><b data-t="bayarExtraLabel">+ Lainnya</b><span data-t="bayarExtraDesc">Bisa ditambah admin</span></div>
          </div>`;
        payGrid.innerHTML = chipsHtml;
        // re-apply extra label/desc texts (baru saja diganti innerHTML)
        const extraLabel = payGrid.querySelector('[data-t="bayarExtraLabel"]');
        const extraDesc  = payGrid.querySelector('[data-t="bayarExtraDesc"]');
        if (extraLabel) extraLabel.textContent = t.bayarExtraLabel || '+ Lainnya';
        if (extraDesc)  extraDesc.textContent  = t.bayarExtraDesc  || 'Bisa ditambah admin';

        const qrisGrid = document.getElementById('qrisGrid');
        qrisGrid.innerHTML = withPhoto.map((m) => `
          <div class="qris-card">
            <b>${escapeHtml(m.icon || '📲')} ${escapeHtml(m.name)}</b>
            <img src="${m.photo}" alt="QR ${escapeHtml(m.name)}">
          </div>`).join('') || (
            methods.some((m) => /qris/i.test(m.name))
              ? `<div class="qris-card"><b>📲 QRIS</b><div class="empty">Foto QR belum ditambahkan admin lewat /settings</div></div>`
              : ''
          );
      } catch (err) {
        console.error(err);
      }
    })();
  </script>
</body>
</html>
