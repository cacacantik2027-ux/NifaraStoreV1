<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cara Order — Nifara Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="/index.html" class="brand"><span data-brand-main>NIFARA</span> <em data-brand-accent>STORE</em></a>
      <div class="nav-links">
        <a href="/produk.html" data-nav="produk">Produk</a>
        <a href="/cara-order.html" data-nav="alur">Cara Order</a>
        <a href="/pembayaran.html" data-nav="bayar">Pembayaran</a>
      </div>
      <a href="#" target="_blank" rel="noopener" class="btn btn-brass" data-nav-cta>Buka di Telegram</a>
      <button type="button" class="nav-toggle" data-nav-toggle aria-label="Buka menu">☰</button>
    </div>
  </nav>

  <div class="page-header">
    <div class="wrap">
      <a href="/index.html" class="back-link">← Kembali ke Beranda</a>
    </div>
  </div>

  <section id="alur" class="flow-section">
    <div class="wrap">
      <div class="section-head dark">
        <h2 data-t="alurTitle">Cara order</h2>
        <p data-t="alurDesc">Ditulis langsung dari alur di bot.</p>
      </div>

      <div class="receipt">
        <div class="rhead">
          <div class="mono" data-t="alurNotaLabel">NOTA ALUR PEMESANAN</div>
          <h3 data-t="alurNotaTitle">Nifara Store</h3>
        </div>

        <div id="rsteps"></div>

        <div class="rfoot">
          <span data-t="alurFootLeft">Sen–Sab, 08.00–21.00 WIB</span>
          <span data-t="alurFootRight">*** terima kasih ***</span>
        </div>
      </div>
    </div>
  </section>

  <footer>
    <div class="wrap" data-footer-text>© Nifara Store 2026</div>
  </footer>

  <script src="/site.js"></script>
  <script>
    (async function () {
      try {
        const data = await loadSiteData();
        renderChrome(data, 'alur', 'Cara Order');
        const t = data.texts || {};
        document.querySelectorAll('[data-t]').forEach((el) => {
          const key = el.getAttribute('data-t');
          if (t[key] != null) el.textContent = t[key];
        });

        const stepsEl = document.getElementById('rsteps');
        let html = '';
        for (let i = 1; i <= 8; i++) {
          const title = t['alurStep' + i + 'Title'] || '';
          const desc  = t['alurStep' + i + 'Desc']  || '';
          html += `
            <div class="rstep">
              <div class="num">${String(i).padStart(2, '0')}</div>
              <div><b>${escapeHtml(title)}</b><p>${escapeHtml(desc)}</p></div>
            </div>`;
        }
        stepsEl.innerHTML = html;
      } catch (err) {
        console.error(err);
      }
    })();
  </script>
</body>
</html>
